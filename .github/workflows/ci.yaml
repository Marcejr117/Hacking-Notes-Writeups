name: Build and Test

on:
  pull_request:
    branches:
      - v5
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartz-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout private content submodules
        if: ${{ env.SUBMODULES_TOKEN != '' }}
        env:
          GITHUB_REPO_CLONE_TOKEN: ${{ env.SUBMODULES_TOKEN }}
        run: bash scripts/vercel-install.sh

      - name: Warn when private content is unavailable
        if: ${{ env.SUBMODULES_TOKEN == '' }}
        run: echo "::warning::SUBMODULES_TOKEN is not configured; building public root content only."

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - name: Install Quartz plugins
        run: |
          rm -rf .quartz/plugins
          npx quartz plugin install --from-config
          node scripts/verify-password-plugin.mjs

      - name: Check password plugin
        run: |
          npm --prefix plugins/password-protect ci
          npm --prefix plugins/password-protect run check

      - name: Check types and style
        run: npm run check

      - name: Test
        run: npm test

      - name: Ensure Quartz builds
        run: npx quartz build
